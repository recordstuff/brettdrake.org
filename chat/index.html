<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat | Brett Drake</title>
  <meta name="description" content="Chat with Brett Drake's AI assistant and explore the language models available through his C#/.NET API.">
  <link rel="canonical" href="https://brettdrake.org/chat/">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=Literata:wght@400;600&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="chat.css?v=6">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"></script>
  <script defer src="js/dialog.js"></script>
  <script defer src="js/modelselector.js"></script>
  <script defer src="js/aichat.js?v=2"></script>
</head>

<body>
  <main class="paper-note ai-chat chat-page" id="aiChat" data-endpoint="https://brettdrake.org:8080/Chat" aria-labelledby="ai-chat-title">
    <a class="chat-back-link" href="../">← Back to BrettDrake.org</a>
    <h1 id="ai-chat-title">AI-Native Chat Assistant</h1>
    <div class="ai-chat-model-controls">
      <label for="aiChatModelSelect">Language model</label>
      <div class="ai-chat-model-picker">
        <select id="aiChatModelSelect" disabled>
          <option value="">Select a model</option>
        </select>
        <button class="button-blue" id="aiChatChangeModelButton" type="button" disabled>Change model</button>
      </div>
      <p class="ai-chat-model-status" id="aiChatModelStatus" role="status" data-state="checking">
        <span class="loading-spinner" id="modelLoadingSpinner" aria-hidden="true"></span>
        <span id="aiChatModelStatusText">Loaded model: Checking…</span>
      </p>
    </div>
    <p class="ai-chat-status" id="aiChatStatusText" role="status">Ready</p>
    <div class="ai-chat-messages" id="aiChatMessages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>
    <form id="aiChatForm" class="ai-chat-form">
      <label for="aiChatPrompt">Your message</label>
      <textarea id="aiChatPrompt" rows="3" required></textarea>
      <div class="ai-chat-actions">
        <button class="button-blue" id="aiChatSendButton" type="submit">Send</button>
        <button class="button-blue" id="aiChatStopButton" type="button" hidden>Stop</button>
      </div>
    </form>
    <noscript>Enable JavaScript to use the chat.</noscript>
  </main>
  <dialog class="site-dialog" id="confirmationDialog" aria-labelledby="confirmationDialogTitle">
    <form method="dialog">
      <h2 id="confirmationDialogTitle"></h2>
      <p id="confirmationDialogMessage"></p>
      <div class="site-dialog-actions">
        <button class="button-blue" id="confirmationDialogCancelButton" type="submit">Cancel</button>
        <button class="button-blue" id="confirmationDialogConfirmButton" type="submit">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
