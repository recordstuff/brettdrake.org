<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brett's AI Native Development -- AI Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,500..800&family=Public+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #eef6ff;
            --muted: #8db9dc;
            --paper: #01050a;
            --panel: #030d18;
            --panel-2: #061523;
            --line: #0b5ea8;
            --blue: #00a8ff;
            --electric-blue: #2fc8ff;
            --deep-blue: #0038ff;
            --cyan: #66e3ff;
            --glow: rgba(0, 168, 255, .35);
            --shadow: 0 28px 90px rgba(0, 0, 0, .62);
            --display-font: "Bricolage Grotesque", "Public Sans", ui-sans-serif, system-ui, sans-serif;
            --body-font: "Public Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                radial-gradient(circle at 18% 8%, rgba(0, 168, 255, .30), transparent 28%),
                radial-gradient(circle at 84% 14%, rgba(0, 56, 255, .22), transparent 24%),
                linear-gradient(135deg, rgba(0, 168, 255, .14), transparent 34%),
                linear-gradient(315deg, rgba(0, 56, 255, .11), transparent 38%),
                linear-gradient(180deg, #000000, var(--paper) 48%),
                var(--paper);
            font-family: var(--body-font);
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            inset: 0;
            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(47, 200, 255, .055) 0 1px,
                    transparent 1px 4px
                ),
                repeating-linear-gradient(
                    135deg,
                    transparent 0 34px,
                    rgba(0, 56, 255, .13) 34px 35px,
                    transparent 35px 70px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 168, 255, .055) 1px,
                    transparent 1px
                );
            background-size: auto, 140px 140px, 54px 54px;
            mix-blend-mode: screen;
        }

        body::after {
            content: "01001011 00111110 10110100 01101110 11100101 00010110 01011100 10101001 00101101 11001010 01001011 00111110 10110100 01101110 11100101 00010110 01011100 10101001 00101101 11001010";
            inset: -18% -8% auto -8%;
            color: rgba(47, 200, 255, .12);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: .82rem;
            line-height: 2.1;
            letter-spacing: .22em;
            overflow-wrap: anywhere;
            text-shadow:
                0 0 12px rgba(47, 200, 255, .34),
                0 0 24px rgba(0, 56, 255, .24);
            transform: rotate(-7deg);
            animation: matrix-drift 28s linear infinite;
        }

        @keyframes matrix-drift {
            0% {
                translate: 0 -10%;
            }

            100% {
                translate: 0 68%;
            }
        }

        .page {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 40px;
            position: relative;
            z-index: 1;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--electric-blue);
            box-shadow:
                0 0 10px var(--electric-blue),
                0 0 28px var(--blue),
                0 0 48px var(--deep-blue);
            flex: 0 0 auto;
        }

        .brand-title {
            margin: 0;
            font-family: var(--display-font);
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            font-weight: 800;
            letter-spacing: .04em;
            color: var(--electric-blue);
            text-shadow: 0 0 16px var(--glow);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 7px 11px;
            border: 1px solid rgba(47, 200, 255, .28);
            border-radius: 999px;
            background: rgba(3, 13, 24, .78);
            color: var(--muted);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: .76rem;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--electric-blue);
            box-shadow: 0 0 12px var(--electric-blue);
        }

        .shell {
            min-height: calc(100vh - 112px);
            display: grid;
            grid-template-rows: auto minmax(320px, auto) auto;
            overflow: visible;
            border: 1px solid rgba(47, 200, 255, .34);
            border-radius: 10px;
            background:
                linear-gradient(
                    135deg,
                    rgba(3, 13, 24, .97),
                    rgba(1, 7, 14, .97)
                ),
                radial-gradient(
                    circle at top left,
                    rgba(0, 168, 255, .18),
                    transparent 42%
                );
            box-shadow:
                var(--shadow),
                0 0 42px rgba(0, 168, 255, .14);
            backdrop-filter: blur(14px);
        }

        .shell-head {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(47, 200, 255, .18);
            border-radius: 10px 10px 0 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 168, 255, .09),
                    transparent 45%
                ),
                rgba(0, 0, 0, .18);
        }

        .shell-head h1 {
            margin: 0;
            font-family: var(--display-font);
            font-size: clamp(1.35rem, 3vw, 2.25rem);
            line-height: 1;
            text-shadow: 0 0 22px rgba(47, 200, 255, .30);
        }

        .shell-head h1 em {
            color: var(--electric-blue);
            font-style: normal;
        }

        .messages {
            min-width: 0;
            min-height: 320px;
            padding: 22px;
        }

        .message {
            display: grid;
            gap: 7px;
            margin: 0 0 18px;
            animation: message-in .18s ease-out;
        }

        @keyframes message-in {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-label {
            color: #63a9d5;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .10em;
            text-transform: uppercase;
        }

        .message-bubble {
            width: fit-content;
            max-width: min(760px, 88%);
            padding: 13px 15px;
            border: 1px solid rgba(47, 200, 255, .20);
            border-radius: 8px;
            background: rgba(3, 16, 28, .86);
            color: #dceeff;
            line-height: 1.62;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            box-shadow:
                0 12px 28px rgba(0, 0, 0, .22),
                inset 0 1px 0 rgba(255, 255, 255, .025);
        }

        .message.user {
            justify-items: end;
        }

        .message.user .message-label {
            color: #8bcfff;
        }

        .message.user .message-bubble {
            border-color: rgba(47, 200, 255, .38);
            background:
                linear-gradient(
                    135deg,
                    rgba(0, 88, 160, .42),
                    rgba(0, 43, 92, .64)
                );
        }

        .message.assistant .message-bubble {
            border-color: rgba(0, 56, 255, .34);
            background:
                linear-gradient(
                    135deg,
                    rgba(4, 18, 33, .94),
                    rgba(1, 9, 18, .94)
                );
        }

        .welcome {
            max-width: 720px;
            margin: 10vh auto 0;
            text-align: center;
            color: var(--muted);
        }

        .welcome-code {
            margin-bottom: 14px;
            color: var(--electric-blue);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: .78rem;
            letter-spacing: .10em;
            text-transform: uppercase;
            text-shadow: 0 0 16px rgba(47, 200, 255, .40);
        }

        .welcome strong {
            display: block;
            margin-bottom: 8px;
            color: var(--ink);
            font-family: var(--display-font);
            font-size: clamp(1.4rem, 3vw, 2.25rem);
        }

        .composer {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            align-items: end;
            padding: 16px;
            border-top: 1px solid rgba(47, 200, 255, .18);
            border-radius: 0 0 10px 10px;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 56, 255, .07),
                    rgba(0, 168, 255, .05)
                ),
                rgba(0, 0, 0, .26);
        }

        .composer > div {
            min-width: 0;
        }

        textarea {
            width: 100%;
            min-height: 92px;
            max-height: 240px;
            resize: vertical;
            display: block;
            padding: 14px 15px;
            border: 1px solid rgba(47, 200, 255, .28);
            border-radius: 8px;
            outline: none;
            background: rgba(1, 8, 16, .90);
            color: var(--ink);
            font: 500 .98rem/1.5 var(--body-font);
            caret-color: var(--electric-blue);
        }

        textarea::placeholder {
            color: #547c99;
        }

        textarea:focus {
            border-color: var(--electric-blue);
            box-shadow:
                0 0 0 3px rgba(0, 168, 255, .10),
                0 0 28px rgba(0, 168, 255, .14);
        }

        .hint {
            margin: 7px 2px 0;
            color: #527994;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: .70rem;
        }

        button {
            min-width: 118px;
            min-height: 52px;
            padding: 0 18px;
            border: 1px solid rgba(102, 227, 255, .66);
            border-radius: 8px;
            background:
                linear-gradient(
                    135deg,
                    #0076d8,
                    #0038ff 72%
                );
            color: white;
            font-family: var(--display-font);
            font-size: .95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow:
                0 12px 30px rgba(0, 56, 255, .30),
                0 0 24px rgba(0, 168, 255, .22);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.12);
        }

        button:disabled {
            cursor: progress;
            opacity: .58;
        }

        .error .message-label,
        .error .message-bubble {
            color: #ffb7c4;
        }

        .error .message-bubble {
            border-color: rgba(255, 80, 110, .38);
            background: rgba(62, 5, 18, .52);
        }

        @media (max-width: 720px) {
            .page {
                width: min(100% - 18px, 1120px);
                padding-top: 10px;
            }

            .topbar {
                align-items: flex-start;
            }

            .brand-title {
                font-size: 1rem;
                line-height: 1.3;
            }

            .status {
                display: none;
            }

            .shell {
                min-height: calc(100vh - 62px);
                grid-template-rows: auto minmax(240px, auto) auto;
            }

            .shell-head {
                padding: 15px 14px;
            }

            .messages {
                min-height: 240px;
                padding: 16px 12px;
            }

            .message-bubble {
                max-width: 94%;
            }

            .composer {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            textarea {
                min-height: 82px;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 420px) {
            .page {
                width: calc(100% - 10px);
            }

            .brand-mark {
                width: 11px;
                height: 11px;
            }

            .brand-title {
                font-size: .92rem;
            }

            .shell-head h1 {
                font-size: 1.25rem;
            }

            .messages {
                padding: 14px 9px;
            }

            .message-bubble {
                max-width: 97%;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <header class="topbar">
            <div class="brand">
                <span class="brand-mark"></span>

                <p class="brand-title">
                    Brett's AI Native Development -- AI Chat
                </p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">READY</span>
            </div>
        </header>

        <section class="shell">

            <div class="shell-head">
                <h1>LOCAL <em>AI</em> CHAT</h1>
            </div>

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">
                    <div class="welcome-code">
                        SYSTEM // ONLINE
                    </div>

                    <strong>
                        Ask the local model something.
                    </strong>

                    Responses stream into the terminal as they are generated.
                </div>

            </div>

            <div class="composer">

                <div>
                    <textarea
                        id="prompt"
                        rows="4"
                        placeholder="Enter prompt..."
                        autofocus></textarea>

                    <div class="hint">
                        ENTER = SEND &nbsp; // &nbsp; SHIFT+ENTER = NEW LINE
                    </div>
                </div>

                <button
                    id="sendButton"
                    type="button"
                    onclick="sendPrompt()">
                    SEND // &gt;
                </button>

            </div>

        </section>
    </main>

    <script>
        const promptInput = document.getElementById("prompt");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");
        const statusText = document.getElementById("statusText");

        let scrollPending = false;

        function scrollPageToBottom() {
            if (scrollPending) {
                return;
            }

            scrollPending = true;

            requestAnimationFrame(() => {
                window.scrollTo(
                    0,
                    document.documentElement.scrollHeight
                );

                scrollPending = false;
            });
        }

        promptInput.addEventListener("keydown", function (event) {
            if (
                event.key === "Enter" &&
                !event.shiftKey &&
                !event.isComposing
            ) {
                event.preventDefault();
                sendPrompt();
            }
        });

        function addMessage(role, text = "") {
            const welcome = document.getElementById("welcome");

            if (welcome) {
                welcome.remove();
            }

            const wrapper = document.createElement("div");
            wrapper.className = `message ${role}`;

            const label = document.createElement("div");
            label.className = "message-label";

            label.textContent =
                role === "user"
                    ? "YOU"
                    : "LOCAL MODEL";

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.textContent = text;

            wrapper.appendChild(label);
            wrapper.appendChild(bubble);

            messages.appendChild(wrapper);

            scrollPageToBottom();

            return {
                wrapper,
                bubble
            };
        }

        async function sendPrompt() {
            const prompt = promptInput.value.trim();

            if (!prompt || sendButton.disabled) {
                return;
            }

            addMessage("user", prompt);

            promptInput.value = "";

            sendButton.disabled = true;
            statusText.textContent = "STREAMING";

            const assistantMessage =
                addMessage("assistant");

            try {
                const response = await fetch(
                    "https://brettdrake.org:8080/Chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(prompt)
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `${response.status} ${response.statusText}`
                    );
                }

                if (!response.body) {
                    throw new Error(
                        "Response stream is unavailable."
                    );
                }

                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder();

                while (true) {
                    const {
                        value,
                        done
                    } = await reader.read();

                    if (done) {
                        assistantMessage.bubble.textContent +=
                            decoder.decode();

                        scrollPageToBottom();

                        break;
                    }

                    assistantMessage.bubble.textContent +=
                        decoder.decode(
                            value,
                            {
                                stream: true
                            }
                        );

                    scrollPageToBottom();
                }

                statusText.textContent = "READY";
            }
            catch (error) {
                console.error(error);

                assistantMessage.wrapper
                    .classList.add("error");

                assistantMessage.bubble.textContent =
                    error;

                statusText.textContent = "ERROR";

                scrollPageToBottom();
            }
            finally {
                sendButton.disabled = false;

                promptInput.focus({
                    preventScroll: true
                });

                scrollPageToBottom();
            }
        }
    </script>
</body>
</html>
