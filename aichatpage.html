<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brett's AI Native Development -- AI Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,500..800&family=Public+Sans:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ink: #eef6ff;
            --muted: #8db9dc;
            --paper: #01050a;
            --panel: #030d18;
            --panel-2: #061523;
            --line: #0b5ea8;
            --blue: #00a8ff;
            --electric-blue: #2fc8ff;
            --deep-blue: #0038ff;
            --cyan: #66e3ff;
            --glow: rgba(0, 168, 255, .35);
            --shadow: 0 28px 90px rgba(0, 0, 0, .62);
            --display-font: "Bricolage Grotesque", "Public Sans", ui-sans-serif, system-ui, sans-serif;
            --body-font: "Public Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);

            background:
                radial-gradient(circle at 18% 8%, rgba(0, 168, 255, .30), transparent 28%),
                radial-gradient(circle at 84% 14%, rgba(0, 56, 255, .22), transparent 24%),
                linear-gradient(135deg, rgba(0, 168, 255, .14), transparent 34%),
                linear-gradient(315deg, rgba(0, 56, 255, .11), transparent 38%),
                linear-gradient(180deg, #000000, var(--paper) 48%),
                var(--paper);

            font-family: var(--body-font);
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            inset: 0;

            background:
                repeating-linear-gradient(
                    180deg,
                    rgba(47, 200, 255, .055) 0 1px,
                    transparent 1px 4px
                ),
                repeating-linear-gradient(
                    135deg,
                    transparent 0 34px,
                    rgba(0, 56, 255, .13) 34px 35px,
                    transparent 35px 70px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 168, 255, .055) 1px,
                    transparent 1px
                );

            background-size:
                auto,
                140px 140px,
                54px 54px;

            mix-blend-mode: screen;
        }

        body::after {
            content: "01001011 00111110 10110100 01101110 11100101 00010110 01011100 10101001 00101101 11001010 01001011 00111110 10110100 01101110 11100101 00010110 01011100 10101001 00101101 11001010";

            inset: -18% -8% auto -8%;
            color: rgba(47, 200, 255, .12);

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: .82rem;
            line-height: 2.1;
            letter-spacing: .22em;
            overflow-wrap: anywhere;

            text-shadow:
                0 0 12px rgba(47, 200, 255, .34),
                0 0 24px rgba(0, 56, 255, .24);

            transform: rotate(-7deg);
            animation: matrix-drift 28s linear infinite;
        }

        @keyframes matrix-drift {
            0% {
                translate: 0 -10%;
            }

            100% {
                translate: 0 68%;
            }
        }

        .page {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 40px;

            position: relative;
            z-index: 1;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 18px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 14px;
            height: 14px;
            flex: 0 0 auto;

            border-radius: 50%;

            background: var(--electric-blue);

            box-shadow:
                0 0 10px var(--electric-blue),
                0 0 28px var(--blue),
                0 0 48px var(--deep-blue);
        }

        .brand-title {
            margin: 0;

            font-family: var(--display-font);
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            font-weight: 800;
            letter-spacing: .02em;

            color: var(--ink);

            text-shadow:
                0 0 16px rgba(47, 200, 255, .20);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            flex-wrap: wrap;
        }

        .site-link {
            display: inline-block;
            width: fit-content;
            max-width: 100%;

            color: #66d9ff;
            text-decoration: none;

            padding-bottom: 3px;

            background:
                linear-gradient(
                    90deg,
                    #2fc8ff,
                    #2fc8ff
                ) 0 100% / 100% 2px no-repeat,

                linear-gradient(
                    90deg,
                    rgba(47, 200, 255, .2),
                    transparent
                ) 0 100% / 100% 5px no-repeat;

            text-shadow:
                0 0 10px rgba(47, 200, 255, .18);

            transition:
                color .2s ease,
                background-size .2s ease,
                text-shadow .2s ease;
        }

        .site-link:hover {
            color: #2fc8ff;

            background-size:
                100% 5px,
                100% 11px;

            text-shadow:
                0 0 10px rgba(47, 200, 255, .45),
                0 0 18px rgba(0, 168, 255, .22);
        }

        .site-link:focus-visible {
            outline: 2px solid #2fc8ff;
            outline-offset: 4px;
        }

        .status {
            display: inline-flex;
            align-items: center;

            gap: 8px;

            min-height: 34px;
            padding: 7px 11px;

            border: 1px solid rgba(47, 200, 255, .28);
            border-radius: 999px;

            background: rgba(3, 13, 24, .78);
            color: var(--muted);

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: .76rem;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .03);

            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--electric-blue);

            box-shadow:
                0 0 12px var(--electric-blue);
        }

        .shell {
            min-height: calc(100vh - 112px);

            display: grid;

            grid-template-rows:
                auto
                minmax(320px, 1fr)
                auto;

            overflow: hidden;

            border: 1px solid rgba(47, 200, 255, .34);
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    rgba(3, 13, 24, .97),
                    rgba(1, 7, 14, .97)
                ),
                radial-gradient(
                    circle at top left,
                    rgba(0, 168, 255, .18),
                    transparent 42%
                );

            box-shadow:
                var(--shadow),
                0 0 42px rgba(0, 168, 255, .14);

            backdrop-filter: blur(14px);
        }

        .shell-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;
            padding: 18px 20px;

            border-bottom:
                1px solid rgba(47, 200, 255, .18);

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 168, 255, .09),
                    transparent 45%
                ),
                rgba(0, 0, 0, .18);
        }

        .shell-head h1 {
            margin: 0;

            font-family: var(--display-font);
            font-size: clamp(1.35rem, 3vw, 2.25rem);
            line-height: 1;
            letter-spacing: .01em;

            text-shadow:
                0 0 22px rgba(47, 200, 255, .30);
        }

        .shell-head h1 em {
            color: var(--electric-blue);
            font-style: normal;
        }

        .shell-meta {
            color: #5fa3d0;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: .76rem;
            text-align: right;
        }

        .messages {
            min-height: 320px;

            padding: 22px;

            overflow: visible;
        }

        .message {
            display: grid;
            gap: 7px;

            margin: 0 0 18px;

            animation:
                message-in .18s ease-out;
        }

        @keyframes message-in {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-label {
            color: #63a9d5;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .10em;
            text-transform: uppercase;
        }

        .message-bubble {
            width: fit-content;
            max-width: min(760px, 88%);

            padding: 13px 15px;

            border:
                1px solid rgba(47, 200, 255, .20);

            border-radius: 8px;

            background:
                rgba(3, 16, 28, .86);

            color: #dceeff;

            line-height: 1.62;

            white-space: pre-wrap;
            overflow-wrap: anywhere;

            box-shadow:
                0 12px 28px rgba(0, 0, 0, .22),
                inset 0 1px 0 rgba(255, 255, 255, .025);
        }

        .message.user {
            justify-items: end;
        }

        .message.user .message-label {
            color: #8bcfff;
        }

        .message.user .message-bubble {
            border-color:
                rgba(47, 200, 255, .38);

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 88, 160, .42),
                    rgba(0, 43, 92, .64)
                );

            box-shadow:
                0 14px 32px rgba(0, 0, 0, .26),
                0 0 24px rgba(0, 168, 255, .08);
        }

        .message.assistant .message-bubble {
            border-color:
                rgba(0, 56, 255, .34);

            background:
                linear-gradient(
                    135deg,
                    rgba(4, 18, 33, .94),
                    rgba(1, 9, 18, .94)
                );
        }

        .welcome {
            max-width: 720px;

            margin:
                10vh
                auto
                0;

            text-align: center;

            color: var(--muted);
        }

        .welcome strong {
            display: block;

            margin-bottom: 8px;

            color: var(--ink);

            font-family:
                var(--display-font);

            font-size:
                clamp(1.4rem, 3vw, 2.25rem);
        }

        .composer {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            gap: 12px;
            align-items: end;

            padding: 16px;

            border-top:
                1px solid rgba(47, 200, 255, .18);

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 56, 255, .07),
                    rgba(0, 168, 255, .05)
                ),
                rgba(0, 0, 0, .26);
        }

        .input-wrap {
            min-width: 0;
        }

        textarea {
            width: 100%;

            min-height: 92px;
            max-height: 240px;

            resize: vertical;

            display: block;

            padding: 14px 15px;

            border:
                1px solid rgba(47, 200, 255, .28);

            border-radius: 8px;

            outline: none;

            background:
                rgba(1, 8, 16, .90);

            color: var(--ink);

            font:
                500
                .98rem/1.5
                var(--body-font);

            caret-color:
                var(--electric-blue);

            box-shadow:
                inset 0 0 0 1px rgba(0, 168, 255, .02),
                inset 0 0 28px rgba(0, 56, 255, .05);

            transition:
                border-color .18s ease,
                box-shadow .18s ease;
        }

        textarea::placeholder {
            color: #547c99;
        }

        textarea:focus {
            border-color:
                var(--electric-blue);

            box-shadow:
                0 0 0 3px rgba(0, 168, 255, .10),
                0 0 28px rgba(0, 168, 255, .14),
                inset 0 0 28px rgba(0, 56, 255, .08);
        }

        .hint {
            margin: 7px 2px 0;

            color: #527994;

            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;

            font-size: .70rem;
        }

        button {
            min-width: 118px;
            min-height: 52px;

            padding: 0 18px;

            border:
                1px solid rgba(102, 227, 255, .66);

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #0076d8,
                    #0038ff 72%
                );

            color: white;

            font-family:
                var(--display-font);

            font-size: .95rem;
            font-weight: 800;
            letter-spacing: .03em;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(0, 56, 255, .30),
                0 0 24px rgba(0, 168, 255, .22),
                inset 0 1px 0 rgba(255, 255, 255, .18);

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                filter .18s ease;
        }

        button:hover:not(:disabled) {
            transform:
                translateY(-2px);

            filter:
                brightness(1.12);

            box-shadow:
                0 16px 34px rgba(0, 56, 255, .38),
                0 0 34px rgba(47, 200, 255, .32),
                inset 0 1px 0 rgba(255, 255, 255, .20);
        }

        button:active:not(:disabled) {
            transform:
                translateY(1px);

            filter:
                brightness(.9);

            box-shadow:
                0 5px 14px rgba(0, 56, 255, .28),
                inset 0 2px 5px rgba(0, 0, 0, .30);
        }

        button:disabled {
            cursor: progress;
            opacity: .58;
        }

        .error .message-label,
        .error .message-bubble {
            color: #ffb7c4;
        }

        .error .message-bubble {
            border-color:
                rgba(255, 80, 110, .38);

            background:
                rgba(62, 5, 18, .52);
        }

        @media (max-width: 720px) {
            .page {
                width:
                    min(100% - 18px, 1120px);

                padding-top: 10px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;

                margin-bottom: 10px;
            }

            .topbar-actions {
                width: 100%;

                justify-content:
                    space-between;
            }

            .brand-title {
                font-size: 1rem;
            }

            .shell {
                min-height:
                    calc(100vh - 62px);
            }

            .shell-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .messages {
                min-height: 280px;

                padding:
                    16px
                    12px;
            }

            .message-bubble {
                max-width: 94%;
            }

            .composer {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .topbar-actions {
                align-items: flex-start;

                gap: 10px;
            }

            .site-link {
                white-space: normal;
            }

            .shell-head {
                padding: 16px;
            }

            .shell-head h1 {
                font-size: 1.45rem;
            }

            .composer {
                padding: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::after {
                animation: none;
            }

            .message {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <header class="topbar">

            <div class="brand">

                <span
                    class="brand-mark"
                    aria-hidden="true">
                </span>

                <p class="brand-title">
                    Brett's AI Native Development -- AI Chat
                </p>

            </div>

            <div class="topbar-actions">

                <a
                    class="site-link"
                    href="https://brettdrake.org/">
                    BrettDrake.org
                </a>

                <div
                    class="status"
                    id="status">

                    <span
                        class="status-dot"
                        aria-hidden="true">
                    </span>

                    <span id="statusText">
                        READY
                    </span>

                </div>

            </div>

        </header>

        <section
            class="shell"
            aria-label="AI chat">

            <div class="shell-head">

                <h1>
                    LOCAL <em>AI</em> CHAT
                </h1>

                <div class="shell-meta">
                    LIVE STREAMING RESPONSE
                </div>

            </div>

            <div
                class="messages"
                id="messages"
                aria-live="polite">

                <div
                    class="welcome"
                    id="welcome">

                    <strong>
                        Ask the local model something.
                    </strong>

                    Responses stream into the chat as they are generated.

                </div>

            </div>

            <div class="composer">

                <div class="input-wrap">

                    <textarea
                        id="prompt"
                        rows="4"
                        placeholder="Enter prompt..."
                        autofocus></textarea>

                    <div class="hint">
                        ENTER = SEND &nbsp; • &nbsp; SHIFT+ENTER = NEW LINE
                    </div>

                </div>

                <button
                    id="sendButton"
                    type="button"
                    onclick="sendPrompt()">
                    SEND &gt;
                </button>

            </div>

        </section>

    </main>

    <script>
        const promptInput =
            document.getElementById("prompt");

        const messages =
            document.getElementById("messages");

        const welcome =
            document.getElementById("welcome");

        const sendButton =
            document.getElementById("sendButton");

        const statusText =
            document.getElementById("statusText");

        let scrollPending = false;

        function scrollPageToBottom() {
            if (scrollPending) {
                return;
            }

            scrollPending = true;

            requestAnimationFrame(() => {
                window.scrollTo(
                    0,
                    document.documentElement.scrollHeight
                );

                scrollPending = false;
            });
        }

        promptInput.addEventListener(
            "keydown",
            function (event) {
                if (
                    event.key === "Enter" &&
                    !event.shiftKey &&
                    !event.isComposing
                ) {
                    event.preventDefault();
                    sendPrompt();
                }
            }
        );

        function addMessage(
            role,
            text = ""
        ) {
            if (welcome) {
                welcome.remove();
            }

            const wrapper =
                document.createElement("div");

            wrapper.className =
                `message ${role}`;

            const label =
                document.createElement("div");

            label.className =
                "message-label";

            label.textContent =
                role === "user"
                    ? "YOU"
                    : "LOCAL MODEL";

            const bubble =
                document.createElement("div");

            bubble.className =
                "message-bubble";

            bubble.textContent =
                text;

            wrapper.appendChild(
                label
            );

            wrapper.appendChild(
                bubble
            );

            messages.appendChild(
                wrapper
            );

            scrollPageToBottom();

            return {
                wrapper,
                bubble
            };
        }

        async function sendPrompt() {
            const prompt =
                promptInput.value.trim();

            if (
                !prompt ||
                sendButton.disabled
            ) {
                return;
            }

            addMessage(
                "user",
                prompt
            );

            promptInput.value =
                "";

            sendButton.disabled =
                true;

            statusText.textContent =
                "STREAMING";

            const assistantMessage =
                addMessage("assistant");

            try {
                const response =
                    await fetch(
                        "https://brettdrake.org:8080/Chat",
                        {
                            method: "POST",
                            credentials: "include",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    prompt
                                )
                        }
                    );

                if (!response.ok) {
                    throw new Error(
                        `${response.status} ${response.statusText}`
                    );
                }

                if (!response.body) {
                    throw new Error(
                        "Response stream is unavailable."
                    );
                }

                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder();

                while (true) {
                    const {
                        value,
                        done
                    } = await reader.read();

                    if (done) {
                        assistantMessage
                            .bubble
                            .textContent +=
                            decoder.decode();

                        scrollPageToBottom();

                        break;
                    }

                    assistantMessage
                        .bubble
                        .textContent +=
                        decoder.decode(
                            value,
                            {
                                stream: true
                            }
                        );

                    scrollPageToBottom();
                }

                statusText.textContent =
                    "READY";
            }
            catch (error) {
                console.error(
                    error
                );

                assistantMessage
                    .wrapper
                    .classList
                    .add("error");

                assistantMessage
                    .bubble
                    .textContent =
                    error instanceof Error
                        ? error.message
                        : String(error);

                statusText.textContent =
                    "ERROR";

                scrollPageToBottom();
            }
            finally {
                sendButton.disabled =
                    false;

                promptInput.focus({
                    preventScroll: true
                });

                scrollPageToBottom();
            }
        }
    </script>

</body>
</html>
